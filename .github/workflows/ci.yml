name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTEST_ADDOPTS: "-ra --tb=short"

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API
        run: python -m pip install -e ".[dev]"
      - name: Verify API
        working-directory: .
        run: npm run verify:api

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web
        run: npm ci
      - name: Verify web
        working-directory: .
        run: npm run verify:web

  ingestion:
    name: ingestion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/ingestion/pyproject.toml
      - name: Install ingestion
        run: python -m pip install -e ".[dev]"
      - name: Verify ingestion
        working-directory: .
        run: npm run verify:ingestion

  ml:
    name: ml
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/ml/pyproject.toml
      - name: Install ML
        run: python -m pip install -e ".[dev]"
      - name: Verify ML
        working-directory: .
        run: npm run verify:ml

  quality-gates:
    name: quality-gates
    runs-on: ubuntu-latest
    if: always()
    needs: [api, web, ingestion, ml]
    steps:
      - name: Require every domain job
        run: |
          test "${{ needs.api.result }}" = "success"
          test "${{ needs.web.result }}" = "success"
          test "${{ needs.ingestion.result }}" = "success"
          test "${{ needs.ml.result }}" = "success"
