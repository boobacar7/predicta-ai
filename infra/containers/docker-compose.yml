# Laptop datastores only (Postgres/Redis published on localhost).
# Shared or staging-shaped hosts: compose.staging.yml (API + web, Postgres unpublished).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: predicta
      POSTGRES_USER: predicta
      POSTGRES_PASSWORD: predicta
    ports:
      - "5432:5432"
    volumes:
      - predicta_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predicta -d predicta"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  predicta_pg:
