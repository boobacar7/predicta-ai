[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "predicta-api"
version = "0.1.0"
description = "PREDICTA AI FastAPI backend (modular monolith)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.12",
  "pyyaml>=6.0",
  "redis>=5.1",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "jsonschema>=4.23",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
packages = ["app"]
exclude = ["alembic"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["redis", "redis.asyncio"]
ignore_missing_imports = true
