[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "predicta-ingestion"
version = "0.1.0"
description = "PREDICTA AI sports data ingestion, normalization and point-in-time reads."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/predicta_ingestion"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
packages = ["predicta_ingestion"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
