[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "predicta-ml"
version = "0.1.0"
description = "PREDICTA AI football 1X2 training, walk-forward evaluation and model registry."
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.4",
    "lightgbm>=4.5",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "xgboost>=2.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/predicta_ml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
packages = ["predicta_ml"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pyarrow",
    "pyarrow.*",
    "xgboost",
    "xgboost.*",
    "lightgbm",
    "lightgbm.*",
    "joblib",
    "scipy",
    "scipy.*",
    "sklearn",
    "sklearn.*",
]
ignore_missing_imports = true
